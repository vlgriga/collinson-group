x-app: &app
  build:
    context: .
    target: runtime
  image: activity-forecast-service
  environment:
    DATABASE_URL: postgres://activity:activity@postgres:5432/activity
    LOG_FILE_DIR: /app/logs
  volumes:
    # The file sink is only worth anything on a mounted volume (docs/logging.md#the-cost).
    - ./logs:/app/logs
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: activity
      POSTGRES_PASSWORD: activity
      POSTGRES_DB: activity
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U activity -d activity']
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgres://activity:activity@postgres:5432/activity
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: ['node', 'dist/api.js']
    ports:
      - '4000:4000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:4000/health || exit 1']
      interval: 5s
      timeout: 3s
      retries: 10

  # The worker, `node dist/worker.js` on the same image, joins with Refresh (docs/design/refresh.md).

volumes:
  postgres-data:
