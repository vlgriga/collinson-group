name: PR conventions

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  title-and-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: The title follows the commit convention
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | npx --no -- commitlint
      - name: The branch follows the template
        env:
          BRANCH: ${{ github.head_ref }}
        run: make --no-print-directory branch-check
